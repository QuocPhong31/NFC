<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đăng nhập — Trà Quán</title>

  <!-- font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- custom style -->
  <link href="/static/css/login.css" rel="stylesheet">
</head>
<body>
  <div class="login-center">
    <div class="card-login">

      <div class="login-head">
        <div class="login-icon">
          <img
              src="{{ url_for('static', filename='images/logo1.png') }}"
              alt="Tapoka">
        </div>
        <div>
          <h3 class="login-title">Đăng nhập nhân viên / quản trị</h3>
          <small class="login-sub">Dành cho staff & admin</small>
        </div>
      </div>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/admin/login" novalidate>
        <div class="mb-3">
          <label class="small">Tài khoản</label>
          <input name="username" class="form-control" placeholder="tên đăng nhập" required />
        </div>

        <div class="mb-3">
          <label class="small">Mật khẩu</label>
          <input name="password" type="password" class="form-control" placeholder="mật khẩu" required />
        </div>

        <div class="form-row">
          <div>
            <input id="remember" type="checkbox" />
            <label for="remember" class="form-check-label">Ghi nhớ</label>
          </div>
          <div>
            <a href="#" class="small">Cần trợ giúp?</a>
          </div>
        </div>

        <div class="d-grid">
          <button class="btn-primary-custom" type="submit">Đăng nhập</button>
        </div>

        <div class="note">Được xây dựng và phát triển bởi Trần Quốc Phong</div>
      </form>

      <div style="text-align:center;margin-top:12px;color:var(--muted);font-size:13px">
        © {{ current_year or 2026 }} — Tapoka
      </div>

    </div>
  </div>
</body>
</html>
